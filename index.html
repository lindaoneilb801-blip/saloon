<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>صالون الكوافير حمد وديار | حجز أونلاين</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0d0d0d; color: #f5f5f5; text-align: center; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: #181818; padding: 20px; border-radius: 20px; border: 1px solid #d4af37; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        /* واجهة المحل */
        .store-banner { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; border: 2px solid #d4af37; margin-bottom: 15px; }
        .header h1 { color: #d4af37; font-size: 22px; margin-bottom: 3px; }
        .header p { color: #aaa; font-size: 12px; margin-bottom: 18px; }

        .section-title { color: #d4af37; font-size: 14px; margin: 15px 0 8px; text-align: right; font-weight: bold; }

        /* نظام البوكسات الاختيارية */
        .boxes-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
        .boxes-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        
        .box { background: #222; border: 1px solid #444; padding: 12px 8px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 13px; color: #fff; text-align: center; }
        .box:hover { border-color: #d4af37; background: #2a2a2a; }
        .box.active { background: #d4af37; color: #000; font-weight: bold; border-color: #fff; }

        /* حقل الاسم */
        .form-group { margin-bottom: 12px; text-align: right; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #252525; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #d4af37; }

        /* زر الواتساب */
        .btn-whatsapp { width: 100%; padding: 14px; background: #25d366; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .btn-whatsapp:hover { background: #1ebc57; }
        
        .footer { margin-top: 18px; color: #666; font-size: 11px; }
    </style>
</head>
