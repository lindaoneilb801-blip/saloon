<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صالون الكوافير حمد وديار</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0b0b;
      --card-bg: #141414;
      --card-hover: #1f1f1f;
      --accent-red: #e50914;
      --accent-red-hover: #b80710;
      --text-gold: #f5c518;
      --text-light: #f5f5f5;
      --text-gray: #a0a0a0;
      --border-color: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-light);
      line-height: 1.6;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(180deg, #1f0303 0%, var(--bg-color) 100%);
      text-align: center;
      padding: 30px 15px 20px;
      border-bottom: 2px solid var(--accent-red);
    }

    .header-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--text-light);
    }

    .header-title span {
      color: var(--accent-red);
    }

    .header-quote {
      font-size: 14px;
      color: var(--text-gray);
      margin-top: 6px;
      font-style: italic;
    }

    .location-badge {
      display: inline-block;
      background-color: #220505;
      border: 1px solid var(--accent-red);
      color: #ffcccc;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
      font-weight: 700;
    }

    .container {
      max-width: 550px;
      margin: 0 auto;
      padding: 15px;
    }

    .store-banner {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid var(--accent-red);
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent-red);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* اختيار الحلاق */
    .barbers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .barber-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      border: 2px solid var(--border-color);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .barber-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .barber-name {
      font-weight: 700;
      font-size: 16px;
      color: var(--text-light);
    }

    .barber-card.active {
      border-color: var(--accent-red);
      background-color: #1a0505;
      box-shadow: 0 0 12px rgba(229, 9, 20, 0.4);
    }

    .quote-box {
      background: linear-gradient(135deg, #1f0505 0%, var(--card-bg) 100%);
      border-right: 4px solid var(--accent-red);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 25px;
      font-size: 14px;
      color: #e0e0e0;
      text-align: center;
      font-weight: 700;
    }

    /* بوكسات نوع الحلاقة والخدمات */
    .services-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 25px;
    }

    .service-card {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 15px
