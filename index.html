<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صالون الكوافير حمد وديار | حجز أونلاين</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p.subtitle {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #ddd;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #d4af37;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover {
            background: #1ebc57;
        }
        .footer {
            margin-top: 25px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>صالون الكوافير حمد وديار</h1>
    <p class="subtitle">حديثة - الأنبار | حجز موعد حلاقة</p>

    <form id="bookingForm">
        <div class="form-group">
            <label>الاسم الكامل:</label>
            <input type="text" id="name" placeholder="أدخل اسمك الكريم" required>
        </div>

        <div class="form-group">
            <label>اختر الحلاق:</label>
            <select id="barber" required>
                <option value="الكوافير حمد">الكوافير حمد</option>
                <option value="الكوافير ديار">الكوافير ديار</option>
                <option value="أي حلاق متوفر">أي حلاق متوفر</option>
            </select>
        </div>

        <div class="form-group">
            <label>نوع الخدمة:</label>
            <select id="service" required>
                <option value="حلاقة شعر">حلاقة شعر</option>
                <option value="حلاقة ذقن">حلاقة ذقن</option>
                <option value="شعر + ذقن">شعر + ذقن (باقة كاملة)</option>
                <option value="تنظيف بشرة">تنظيف بشرة</option>
                <option value="حلاقة أطفال">حلاقة أطفال</option>
            </select>
        </div>

        <div class="form-group">
            <label>اليوم المفضل:</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label>الوقت المناسب:</label>
            <input type="time" id="time" required>
        </div>

        <button type="button" onclick="sendWhatsApp()">تأكيد الحجز عبر الواتساب 💬</button>
    </form>

    <div class="footer">
        أهلاً وسهلاً بكم في صالون الكوافير حمد وديار
    </div>
</div>

<script>
    function sendWhatsApp() {
        const name = document.getElementById('name').value;
        const barber = document.getElementById('barber').value;
        const service = document.getElementById('service').value;
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;

        if(!name || !date || !time) {
            alert('يرجى ملء جميع الحقول المطلوبة');
            return;
        }

        const phone = "9647800000000"; 
        const message = `مرحباً صالون الكوافير حمد وديار👋%0Aأود حجز موعد جديد:%0A👤 *الاسم:* ${name}%0A✂️ *الحلاق:* ${barber}%0A💈 *الخدمة:* ${service}%0A📅 *التاريخ:* ${date}%0A⏰ *الوقت:* ${time}`;
        
        window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
    }
</script>

</body>
</html>
